# Default OpenAI configuration
# This is what you get out of the box — no config file needed.
# Only useful if you want to change the models.

version: "v1.1"

llm:
  provider: openai
  config:
    model: gpt-oss-120b       # Fact extraction model (cost-efficient default)
    temperature: 0.1

embedder:
  provider: openai
  config:
    model: qwen3-embedding-0.6b  # 1536 dimensions

# Vector store is auto-configured to use the Qdrant container.
# Uncomment to override:
# vector_store:
#   provider: qdrant
#   config:
#     host: qdrant
#     port: 6333
#     collection_name: memories
